name: Serenity Pipeline

on:
  # 主触发器已迁移至 cron-job.org（每1分钟，更精准），GitHub Actions 仅保留手动触发用于调试
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Serenity cron
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_BASE_URL }}/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "HTTP Status: $status"
          echo "Response: $body"

          if [ "$status" != "200" ]; then
            echo "❌ Cron failed with status $status"
            exit 1
          fi

          echo "✅ Cron succeeded"
