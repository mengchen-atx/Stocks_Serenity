name: Serenity Pipeline

on:
  schedule:
    # 备用触发：每15分钟一次，错开整点高峰（在第3、18、33、48分触发）
    # 主要触发器已改为 cron-job.org（更精准，不受 GitHub 限流影响）
    - cron: "3,18,33,48 * * * *"
  # 也可以在 GitHub Actions 页面手动触发，方便调试
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Serenity cron
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_BASE_URL }}/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "HTTP Status: $status"
          echo "Response: $body"

          if [ "$status" != "200" ]; then
            echo "❌ Cron failed with status $status"
            exit 1
          fi

          echo "✅ Cron succeeded"
